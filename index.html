<title>汉化补丁指南导航 · MissyQAQ</title>
<style>
/* ============ 主题变量（与指南页同套配色） ============ */
:root {
	--bg: #0b0f14;
	--bg-glow1: rgba(76, 201, 240, 0.10);
	--bg-glow2: rgba(255, 158, 74, 0.07);
	--panel: #121820;
	--panel2: #0e141b;
	--border: #223041;
	--border2: #2d3d52;
	--text: #d7e1ea;
	--text-dim: #8b9bab;
	--text-faint: #5a6b7d;
	--accent: #4cc9f0;
	--accent2: #ff9e4a;
	--danger: #ff6b6b;
	--warn-text: #ffd166;
	--callout-danger-text: #ffc2c2;
	--mono: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
}
body.theme-light {
	--bg: #f4f7fb;
	--bg-glow1: rgba(120, 170, 255, 0.22);
	--bg-glow2: rgba(255, 205, 120, 0.22);
	--panel: #ffffff;
	--panel2: #f0f4f9;
	--border: #dbe4ee;
	--border2: #c6d3e2;
	--text: #2b3648;
	--text-dim: #5f7186;
	--text-faint: #8a9bb0;
	--accent: #0284c7;
	--accent2: #ea7a1f;
	--danger: #dc3545;
	--warn-text: #a16207;
	--callout-danger-text: #a33040;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
	background:
		radial-gradient(ellipse 1000px 480px at 75% -100px, var(--bg-glow1), transparent),
		radial-gradient(ellipse 800px 420px at 10% -60px, var(--bg-glow2), transparent),
		var(--bg);
	background-attachment: fixed;
	color: var(--text);
	font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	line-height: 1.75;
	font-size: 15.5px;
	transition: background-color .3s, color .3s;
}
a { color: var(--accent); text-decoration: none; }

/* ============ 动态背景（星空 / 流星 / 阳光光斑，与指南页同款） ============ */
.bg-fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; contain: layout paint style; }
.bg-fx .star {
	position: absolute; border-radius: 50%; background: #fff;
	box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
	animation: twinkle var(--tw, 3s) ease-in-out infinite; opacity: .2;
}
@keyframes twinkle { 0%, 100% { opacity: .12; } 50% { opacity: .85; } }
.bg-fx .meteor {
	position: absolute; width: 150px; height: 1.5px; border-radius: 2px;
	background: linear-gradient(90deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, 0));
	box-shadow: 0 0 3px rgba(160, 220, 255, .85);
	transform: rotate(-33deg);
	animation: meteor-fly var(--dur, 10s) linear infinite;
	animation-delay: var(--delay, 0s);
	opacity: 0;
}
@keyframes meteor-fly {
	0% { transform: translate(0, 0) rotate(-33deg); opacity: 0; }
	2% { opacity: 1; }
	28% { transform: translate(-880px, 570px) rotate(-33deg); opacity: 0; }
	100% { transform: translate(-880px, 570px) rotate(-33deg); opacity: 0; }
}
.bg-fx .blob { position: absolute; border-radius: 50%; animation: drift var(--dr, 36s) ease-in-out infinite alternate; display: none; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, -50px) scale(1.15); } }
body.theme-light .bg-fx .star, body.theme-light .bg-fx .meteor { display: none; }
body.theme-light .bg-fx .blob { display: block; }
/* 阳光主题不加动态动效（试过光尘/流云/光晕后定案）：仅保留静态底色光斑 blob，与星空主题的星芒/流星形成昼夜差异 */
@media (prefers-reduced-motion: reduce) {
	.bg-fx .star, .bg-fx .meteor, .bg-fx .blob { animation: none; }
}

/* ============ 标题头 ============ */
.hero { position: relative; z-index: 1; padding: 44px 20px 10px; }
.hero-card {
	max-width: 1180px; margin: 0 auto;
	background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
	padding: 34px 40px 26px;
	box-shadow: 0 10px 40px rgba(0, 0, 0, 0.28);
	position: relative; transition: background .3s;
}
.hero-card h1 { font-size: 38px; letter-spacing: 6px; font-weight: 800; text-shadow: 0 0 30px rgba(76, 201, 240, 0.3); }
.hero-card h1 .sub { display: block; font-size: 21px; letter-spacing: 9px; color: var(--accent); margin-top: 10px; font-weight: 600; }
.hero-card .subtitle { color: var(--text-dim); margin-top: 14px; font-size: 14px; letter-spacing: 1px; }
.hero-card .dt { color: var(--accent2); font-weight: 700; font-size: 14px; letter-spacing: 3px; margin-bottom: 8px; }
.hero-card .dt-block p { font-size: 13.5px; color: var(--text-dim); line-height: 2; }
.dash { border: none; border-top: 1px dashed var(--border2); margin: 20px 0; }
.np-line { color: var(--warn-text); font-weight: 700; font-size: 16px; letter-spacing: 1px; }
.paywall-note {
	margin-top: 12px; padding: 10px 14px; border-radius: 8px;
	border: 1px solid rgba(220, 53, 69, 0.3); background: rgba(220, 53, 69, 0.05);
	font-size: 13px; color: var(--callout-danger-text); line-height: 1.9;
}

/* ============ 主题切换（固定左下，与指南页同款） ============ */
.theme-switch {
	position: fixed; left: 16px; bottom: 16px; z-index: 60; display: flex;
	background: var(--panel); border: 1px solid var(--border2); border-radius: 999px; overflow: hidden;
	box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35); backdrop-filter: blur(6px); user-select: none;
}
.theme-switch button {
	border: none; background: transparent; color: var(--text-dim);
	padding: 8px 16px; font-size: 13px; letter-spacing: 1px; cursor: pointer;
	transition: all .18s; font-family: inherit;
}
.theme-switch button + button { border-left: 1px solid var(--border2); }
.theme-switch button:hover { color: var(--text); }
.theme-switch button.active {
	background: linear-gradient(135deg, rgba(76, 201, 240, 0.28), rgba(76, 201, 240, 0.10));
	color: var(--accent); font-weight: 700;
}

/* ============ B 站个人主页（固定右下边缘悬浮按钮） ============ */
.bili-fab {
	position: fixed; right: 16px; bottom: 16px; z-index: 60;
	width: 46px; height: 46px; border-radius: 50%;
	background: linear-gradient(135deg, #fb7299, #f25d8e);
	color: #fff; display: flex; align-items: center; justify-content: center;
	box-shadow: 0 4px 18px rgba(251, 114, 153, 0.45);
	transition: transform .18s, box-shadow .18s;
}
.bili-fab svg { width: 24px; height: 24px; }
.bili-fab:hover { transform: translateY(-2px) scale(1.06); box-shadow: 0 8px 26px rgba(251, 114, 153, 0.62); text-decoration: none; }
.bili-fab:active { transform: translateY(0) scale(1); }

/* ============ 主体布局 ============ */
.layout { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 26px 20px 60px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.toolbar .count { color: var(--text-dim); font-size: 13.5px; letter-spacing: 1px; }
.toolbar .count strong { color: var(--accent2); font-size: 16px; font-family: var(--mono); padding: 0 3px; }

/* 视图切换（方格 / 列表）：分段胶囊，样式同主题切换 */
.view-switch {
	display: flex; background: var(--panel); border: 1px solid var(--border2); border-radius: 999px; overflow: hidden;
	box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25); user-select: none;
}
.view-switch button {
	border: none; background: transparent; color: var(--text-dim);
	padding: 7px 16px; font-size: 13px; letter-spacing: 1px; cursor: pointer;
	transition: all .18s; font-family: inherit;
}
.view-switch button + button { border-left: 1px solid var(--border2); }
.view-switch button:hover { color: var(--text); }
.view-switch button.active {
	background: linear-gradient(135deg, rgba(255, 158, 74, 0.26), rgba(255, 158, 74, 0.08));
	color: var(--accent2); font-weight: 700;
}

/* ============ 游戏卡片 ============ */
.games.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
.games.list { display: flex; flex-direction: column; gap: 12px; }

.card {
	display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
	overflow: hidden; color: var(--text); position: relative;
	box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
	transition: border-color .18s, transform .18s, box-shadow .18s, background .3s;
}
.card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.34), 0 0 18px rgba(76, 201, 240, 0.12); text-decoration: none; }
.card .cover {
	background: var(--panel2); display: flex; align-items: center; justify-content: center;
	border-bottom: 1px solid var(--border);
}
.card .cover img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
.card .info { padding: 12px 14px 13px; }
.card .name { font-size: 15.5px; font-weight: 700; letter-spacing: .5px; line-height: 1.5; }
.card .name .en { display: block; font-size: 11.5px; font-weight: 400; color: var(--text-faint); letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta { margin-top: 7px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); }
.card .year {
	font-family: var(--mono); font-size: 11.5px; letter-spacing: 1px; color: var(--accent2);
	border: 1px solid rgba(255, 158, 74, 0.5); border-radius: 5px; padding: 0 7px;
}
.card .status {
	font-size: 11px; letter-spacing: 1px; border-radius: 5px; padding: 0 7px;
	border: 1px solid var(--border2); color: var(--text-dim);
	display: inline-block; vertical-align: middle; margin-left: 8px; white-space: nowrap; line-height: 1.7;
}
.card .status.ok { color: var(--ok); border-color: rgba(107, 203, 119, 0.5); background: rgba(107, 203, 119, 0.07); }
.card .plat { letter-spacing: 1px; }
.card .go { margin-left: auto; color: var(--text-faint); font-size: 13px; transition: color .18s, transform .18s; }
.card:hover .go { color: var(--accent); transform: translateX(3px); }

/* 方格模式：方形封面在上，信息在下 */
.games.grid .cover { width: 100%; aspect-ratio: 1 / 1; padding: 14px; }
.games.grid .cover img { width: auto; height: auto; max-height: 100%; }

/* 列表模式：一行一个，缩略封面在左 */
.games.list .card { display: flex; align-items: center; gap: 16px; padding: 10px 16px 10px 10px; }
.games.list .cover { flex: none; width: 72px; height: 72px; border-radius: 8px; border: 1px solid var(--border); padding: 5px; }
.games.list .info { flex: 1; min-width: 0; padding: 0; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.games.list .name { flex: none; max-width: 100%; }
.games.list .meta { margin-top: 0; }

footer.page-foot { position: relative; z-index: 1; color: var(--text-faint); font-size: 12px; line-height: 2; text-align: center; padding: 0 16px 30px; }

/* ============ 移动端 ============ */
@media (max-width: 640px) {
	.hero { padding: 26px 12px 6px; }
	.hero-card { padding: 26px 18px 20px; }
	.hero-card h1 { font-size: 28px; letter-spacing: 3px; }
	.hero-card h1 .sub { font-size: 16px; letter-spacing: 5px; }
	.layout { padding: 20px 14px 50px; }
	.games.grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
	.games.grid .cover { padding: 10px; }
	.card .info { padding: 10px 12px 11px; }
	.card .name { font-size: 14px; }
	.games.list .info { gap: 8px 12px; }
	.theme-switch { left: 10px; bottom: 10px; }
	.theme-switch button { padding: 7px 12px; font-size: 12px; }
	.bili-fab { right: 10px; bottom: 10px; width: 42px; height: 42px; }
	.bili-fab svg { width: 22px; height: 22px; }
}
</style>
</head>
<body>

<!-- 主题预置：默认阳光（missyqaq-theme 非 dark 即阳光），先于内容渲染加类，避免默认主题下的暗色闪屏 -->
<script>(function () { var t = null; try { t = localStorage.getItem('missyqaq-theme'); } catch (e) { } if (t !== 'dark' && document.body) { document.body.classList.add('theme-light'); } })();</script>

<div class="bg-fx" id="bg-fx"></div>

<div class="theme-switch" id="theme-switch">
	<button type="button" id="theme-light" data-mode="light">☀️ 阳光</button>
	<button type="button" id="theme-dark" data-mode="dark">🌙 星空</button>
</div>

<a class="bili-fab" href="https://space.bilibili.com/8431478" target="_blank" rel="noopener" title="B 站个人主页 · MissyQAQ" aria-label="前往 MissyQAQ 的 B 站个人主页">
	<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
		<line x1="6.3" y1="2.4" x2="9.9" y2="6"></line>
		<line x1="17.7" y1="2.4" x2="14.1" y2="6"></line>
		<rect x="2.6" y="6" width="18.8" height="14" rx="4.2"></rect>
		<line x1="8.9" y1="11" x2="8.9" y2="13.8"></line>
		<line x1="15.1" y1="11" x2="15.1" y2="13.8"></line>
	</svg>
</a>

<header class="hero">
	<div class="hero-card">
		<h1>MissyQAQ<span class="sub">汉化补丁 · 指南导航</span></h1>
		<p class="subtitle">个人汉化补丁使用指南集合 · 点击卡片进入对应指南</p>

		<hr class="dash">

		<div class="dt-block">
			<div class="dt">免责声明</div>
			<p>本站汉化补丁由爱好者制作，仅供学习与交流使用。</p>
			<p>游戏版权归版权方所有，请于下载后 24 小时内删除，并支持正版。</p>
			<p>本站补丁免费分享，请勿用于盈利、众筹、收费整合、非法传播等商业用途。</p>
			<p>转载请注明作者和出处，禁止在未经允许情况下进行二次修改及发布。</p>
		</div>

		<hr class="dash">

		<div class="np-line">⚠ 不欢迎任何收费站点收录本站补丁及成品</div>
		<div class="paywall-note">本站全部补丁永久免费分享，任何收费下载行为均与作者无关。请拒绝付费获取，共同维护良好的汉化交流环境。</div>
	</div>
</header>

<main class="layout">
	<div class="toolbar">
		<div class="count" id="game-count"></div>
		<div class="view-switch" id="view-switch">
			<button type="button" data-view="grid">▦ 方格</button>
			<button type="button" data-view="list">☰ 列表</button>
		</div>
	</div>

	<div class="games grid" id="games"></div>
</main>

<footer class="page-foot">
	补丁全程在浏览器本地应用 · 不上传任何文件<br>
	MissyQAQ 汉化补丁指南导航
</footer>

<script>
/* ============ 游戏清单（新增游戏时在此追加条目即可） ============
 * name     游戏名（中文标题）
 * en       副标题（原文/罗马字，可留空 ''）
 * year     发布年份（展示用）
 * platform 平台（如 NDS / PSP / Switch）
 * status   补丁状态（已发布=绿色徽章，其余如 测试版/制作中=灰字徽章，可留空 '' 不显示）
 * cover    封面图路径（相对本页；各游戏公开目录下维护，如 suparobo_gakuen/cover.jpg）
 * href     指南页路径（相对本页的目录链接）
 */
var GAMES = [
	{
		name: '超级机战学园',
		en: 'Suparobo Gakuen',
		year: '2009',
		platform: 'NDS',
		status: '已发布',
		cover: 'suparobo_gakuen/cover.jpg',
		href: 'suparobo_gakuen/'
	},
	{
		name: '古代王者恐龙王 7块碎片',
		en: 'Kodai Ouja: Kyouryuu King - 7-tsu no Kakera',
		year: '2007',
		platform: 'NDS',
		status: '汉化中',
		cover: 'kyouryuu_king/cover.jpg',
		href: 'kyouryuu_king/'
	}
];

/* ============ 渲染卡片（方格/列表共用 DOM，布局由容器 class 切换） ============ */
(function () {
	var box = document.getElementById('games');
	GAMES.forEach(function (g) {
		var a = document.createElement('a');
		a.className = 'card';
		a.href = g.href;

		var cover = document.createElement('div');
		cover.className = 'cover';
		var img = document.createElement('img');
		img.src = g.cover;
		img.alt = g.name + ' 封面';
		img.loading = 'lazy';
		cover.appendChild(img);

		var info = document.createElement('div');
		info.className = 'info';
		var name = document.createElement('div');
		name.className = 'name';
		name.appendChild(document.createTextNode(g.name));
		/* 状态徽章：紧跟游戏名右侧 */
		if (g.status) {
			var st = document.createElement('span');
			st.className = 'status' + (g.status === '已发布' ? ' ok' : '');
			st.textContent = g.status;
			name.appendChild(st);
		}
		if (g.en) {
			var en = document.createElement('span');
			en.className = 'en';
			en.textContent = g.en;
			name.appendChild(en);
		}
		var meta = document.createElement('div');
		meta.className = 'meta';
		var year = document.createElement('span');
		year.className = 'year';
		year.textContent = g.year;
		var plat = document.createElement('span');
		plat.className = 'plat';
		plat.textContent = g.platform;
		meta.appendChild(year);
		meta.appendChild(plat);
		var go = document.createElement('span');
		go.className = 'go';
		go.textContent = '→';
		meta.appendChild(go);

		info.appendChild(name);
		info.appendChild(meta);
		a.appendChild(cover);
		a.appendChild(info);
		box.appendChild(a);
	});

	var count = document.getElementById('game-count');
	count.innerHTML = '共收录 <strong>' + GAMES.length + '</strong> 款游戏';
})();

/* ============ 视图切换（默认方格；记忆于本站） ============ */
(function () {
	var box = document.getElementById('games');
	var btns = document.querySelectorAll('.view-switch button');
	function setView(v) {
		box.className = 'games ' + (v === 'list' ? 'list' : 'grid');
		btns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-view') === v); });
		try { localStorage.setItem('missyqaq-index-view', v); } catch (e) { }
	}
	btns.forEach(function (b) {
		b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
	});
	var saved = null;
	try { saved = localStorage.getItem('missyqaq-index-view'); } catch (e) { }
	setView(saved === 'list' ? 'list' : 'grid');
})();

/* ============ 主题切换（全局 key：与各指南页共用，任一页面切换全站生效） ============ */
var themeBtns = document.querySelectorAll('.theme-switch button');
function applyTheme(mode) {
	document.body.classList.toggle('theme-light', mode === 'light');
	themeBtns.forEach(function (b) {
		b.classList.toggle('active', b.getAttribute('data-mode') === mode);
	});
	try { localStorage.setItem('missyqaq-theme', mode); } catch (e) { }
}
themeBtns.forEach(function (b) {
	b.addEventListener('click', function () { applyTheme(b.getAttribute('data-mode')); });
});
(function () {
	var saved = null;
	try { saved = localStorage.getItem('missyqaq-theme'); } catch (e) { }
	applyTheme(saved === 'dark' ? 'dark' : 'light');   /* 默认阳光：仅显式选择过星空才用暗色 */
})();

/* ============ 动态背景（与指南页同款：46 星 + 7 流星 + 3 光斑） ============ */
(function () {
	var fx = document.getElementById('bg-fx');
	if (!fx) { return; }
	var i, el;
	/* 星星 */
	for (i = 0; i < 46; i++) {
		el = document.createElement('i');
		el.className = 'star';
		el.style.left = (Math.random() * 100).toFixed(2) + '%';
		el.style.top = (Math.random() * 100).toFixed(2) + '%';
		var sz = Math.random() < 0.25 ? 2.5 : (Math.random() < 0.5 ? 2 : 1.5);
		el.style.width = sz + 'px';
		el.style.height = sz + 'px';
		el.style.setProperty('--tw', (2.5 + Math.random() * 3.5).toFixed(2) + 's');
		el.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
		fx.appendChild(el);
	}
	/* 流星 */
	var meteors = [
		{ l: 80, t: 5, dur: 8, delay: 0.8 },
		{ l: 58, t: 12, dur: 10, delay: 3 },
		{ l: 90, t: 22, dur: 8, delay: 5.5 },
		{ l: 68, t: 30, dur: 11, delay: 8 },
		{ l: 45, t: 8, dur: 9, delay: 10.5 },
		{ l: 76, t: 38, dur: 12, delay: 13 },
		{ l: 52, t: 18, dur: 8, delay: 15.5 }
	];
	meteors.forEach(function (m) {
		el = document.createElement('i');
		el.className = 'meteor';
		el.style.left = m.l + '%';
		el.style.top = m.t + '%';
		el.style.setProperty('--dur', m.dur + 's');
		el.style.setProperty('--delay', m.delay + 's');
		fx.appendChild(el);
	});
	/* 阳光光斑：径向渐变自带柔边 */
	var blobs = [
		{ l: 8, t: 12, s: 470, g: 'radial-gradient(circle closest-side, rgba(255, 205, 120, 0.36), rgba(255, 205, 120, 0) 72%)', dur: 34 },
		{ l: 68, t: 4, s: 560, g: 'radial-gradient(circle closest-side, rgba(130, 180, 255, 0.32), rgba(130, 180, 255, 0) 72%)', dur: 42 },
		{ l: 40, t: 62, s: 430, g: 'radial-gradient(circle closest-side, rgba(255, 235, 190, 0.27), rgba(255, 235, 190, 0) 72%)', dur: 38 }
	];
	blobs.forEach(function (b) {
		el = document.createElement('i');
		el.className = 'blob';
		el.style.left = b.l + '%';
		el.style.top = b.t + '%';
		el.style.width = b.s + 'px';
		el.style.height = b.s + 'px';
		el.style.background = b.g;
		el.style.setProperty('--dr', b.dur + 's');
		fx.appendChild(el);
	});
	/* 阳光主题不加动态动效：仅保留 blob 静态光斑（见 CSS 注释） */
})();
</script>
</body>
</html>
